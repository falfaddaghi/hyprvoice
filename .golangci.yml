run:
  timeout: 3m

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - gosimple
    - typecheck

issues:
  exclude-dirs:
    - testdata
  exclude-rules:
    # Allow unchecked errors in test files
    - path: _test\.go
      linters:
        - errcheck
